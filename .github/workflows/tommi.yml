name: T.O.M.M.I. AI Code Reviewer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  tommi:
    # Trigger on PR comments or review thread comments containing /tommi
    if: contains(github.event.comment.body, '/tommi') && (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run T.O.M.M.I.
        uses: ./
        with:
          app-id: ${{ secrets.TOMMI_APP_ID }}
          private-key: ${{ secrets.TOMMI_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
